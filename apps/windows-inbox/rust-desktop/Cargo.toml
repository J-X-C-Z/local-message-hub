[package]
name = "wecom-inbox"
version = "2.0.0"
edition = "2024"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
tiny_http = "0.12"
ureq = { version = "3", default-features = false }
url = "2.5"
wry = "0.55"
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com"] }

[profile.release]
lto = "thin"
strip = true
