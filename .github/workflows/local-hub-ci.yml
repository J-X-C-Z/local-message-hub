name: Local Hub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run local hub checks
        shell: pwsh
        run: ./scripts/check-local-hub.ps1
      - name: Build and smoke-test Windows source bundle
        shell: pwsh
        run: ./scripts/package-windows-source.ps1 -OutputPath ./output/windows/LocalMessageHub-source.zip
