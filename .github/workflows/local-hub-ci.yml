name: Local Hub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Rust 1.98.1 GNU toolchain.' }
          rustup default 1.98.1-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain 1.98.1-x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Windows GNU target.' }
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
      - name: Install MinGW GCC 16.2.0
        shell: msys2 {0}
        run: |
          if ! pacman -S --noconfirm --needed mingw-w64-x86_64-gcc; then
            printf 'Installing the MSYS2 MinGW GCC package failed.\n' >&2
            exit 1
          fi
          version="$(gcc --version | head -n 1)"
          if [[ ! "$version" =~ [[:space:]]16\.2\.0([[:space:]]|$) ]]; then
            printf 'Expected GCC 16.2.0, found %s.\n' "$version" >&2
            exit 1
          fi
      - name: Add MinGW linker to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'mingw64\bin')
      - name: Install public test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Install locked root dependencies for the portable runtime
        shell: pwsh
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Installing the locked root npm dependencies failed.' }
          node node_modules/ffmpeg-static/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Installing the package-pinned FFmpeg binary failed.' }
          if (-not (Test-Path -LiteralPath 'node_modules/ffmpeg-static/ffmpeg.exe' -PathType Leaf)) {
            throw 'The locked ffmpeg-static package did not install its Windows binary.'
          }
      - name: Normalize test temp paths
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Run local hub checks
        shell: pwsh
        run: ./scripts/check-local-hub.ps1
      - name: Check committed changes for whitespace errors
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Could not determine the base commit for whitespace checking.' }
          $LASTEXITCODE = 0
          if ($env:BASE_SHA -match '^0{40}$') {
            Write-Output 'No base commit exists; skipping committed-range whitespace checking for the initial push.'
          } else {
            git fetch --no-tags --depth=1 origin $env:BASE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the base commit for whitespace checking.' }
            git diff --check $env:BASE_SHA HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw 'Committed changes contain whitespace errors.' }
      - name: Build and smoke-test Windows portable package
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -OutputPath ./output/windows/LocalMessageHub-portable-ci
      - name: Build and smoke-test Windows source bundle
        shell: pwsh
        run: ./scripts/package-windows-source.ps1 -OutputPath ./output/windows/LocalMessageHub-source.zip
      - name: Write package provenance manifest
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: >-
          ./scripts/write-package-manifest.ps1
          -PortablePath ./output/windows/LocalMessageHub-portable-ci
          -SourceBundlePath ./output/windows/LocalMessageHub-source.zip
          -CommitSha $env:COMMIT_SHA
          -WorkflowRunId $env:WORKFLOW_RUN_ID
          -BuildContext hosted-ci
          -OutputPath ./output/windows/LocalMessageHub-artifact-manifest.json
      - name: Verify package manifest against upload inputs
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: >-
          ./scripts/verify-package-manifest.ps1
          -ManifestPath ./output/windows/LocalMessageHub-artifact-manifest.json
          -PortablePath ./output/windows/LocalMessageHub-portable-ci
          -SourceBundlePath ./output/windows/LocalMessageHub-source.zip
          -CommitSha $env:COMMIT_SHA
          -WorkflowRunId $env:WORKFLOW_RUN_ID
          -BuildContext hosted-ci
      - name: Upload Windows release packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalMessageHub-windows-release
          path: |
            output/windows/LocalMessageHub-portable-ci/
            output/windows/LocalMessageHub-source.zip
            output/windows/LocalMessageHub-artifact-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Download and verify uploaded release packages
        uses: actions/download-artifact@v4
        with:
          name: LocalMessageHub-windows-release
          path: output/windows/uploaded-release
      - name: Verify downloaded artifact bytes and provenance
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: >-
          ./scripts/verify-package-manifest.ps1
          -ManifestPath ./output/windows/uploaded-release/LocalMessageHub-artifact-manifest.json
          -PortablePath ./output/windows/uploaded-release/LocalMessageHub-portable-ci
          -SourceBundlePath ./output/windows/uploaded-release/LocalMessageHub-source.zip
          -CommitSha $env:COMMIT_SHA
          -WorkflowRunId $env:WORKFLOW_RUN_ID
          -BuildContext hosted-ci
