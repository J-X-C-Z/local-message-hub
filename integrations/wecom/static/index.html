<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业微信 · 实时查看</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e5e7eb; --text:#1f2328; --sub:#6b7280;
  --me:#95ec69; --accent:#07c160; --sys:#9ca3af; --hl:#fff8c5;
  --side:#fafbfc; --hover:#f3f4f6; --sel:#e8f8ee;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;
       display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0;
       box-shadow:0 1px 3px rgba(0,0,0,.04);z-index:5}
h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;flex-shrink:0}
.dot.live{background:var(--accent);box-shadow:0 0 0 3px rgba(7,193,96,.18);
          animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.badge{background:#e8f8ee;color:#0a8f4a;border-radius:10px;padding:2px 8px;
       font-size:12px;font-weight:600;white-space:nowrap}
.badge.warn{background:#fff4e5;color:#b45309}
.tabs{display:flex;gap:6px}
.tab{padding:4px 12px;border-radius:14px;cursor:pointer;font-size:13px;
     border:1px solid var(--line);background:#fff;user-select:none;white-space:nowrap}
.tab .n{font-size:10px;background:#e5e7eb;color:#4b5563;border-radius:8px;
     padding:0 5px;margin-left:4px;vertical-align:1px}
.tab.on .n{background:rgba(255,255,255,.28);color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.stab{padding:3px 11px;border-radius:12px;cursor:pointer;font-size:12px;
     border:1px solid var(--line);background:#fff;user-select:none}
.stab.on{background:#e8f8ee;color:#0a8f4a;border-color:#a7e5c1;font-weight:600}
.stab:hover:not(.on){border-color:var(--accent);color:var(--accent)}
.ntc{background:#fff;border:1px solid var(--line);border-radius:10px;
     padding:12px 15px;margin-bottom:10px}
.ntc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
     margin-bottom:6px}
.ntc .tag{font-size:11px;border-radius:8px;padding:1px 8px;font-weight:600;
     background:#eef2ff;color:#4338ca;white-space:nowrap}
.ntc .tag.grp{background:#fef3c7;color:#b45309}
.ntc .tag.an{background:#fee2e2;color:#b91c1c}
.ntc .tag.sys{background:#f3f4f6;color:#4b5563}
.ntc .tag.login{background:#e0f2fe;color:#0369a1}
.ntc .ttl{font-weight:600;font-size:13px}
.ntc .who{color:var(--sub);font-size:12px}
.ntc .bd{white-space:pre-wrap;word-break:break-word;font-size:13px;
     color:#374151;line-height:1.7}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
     gap:12px}
.app{background:#fff;border:1px solid var(--line);border-radius:10px;
     padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.app img{width:40px;height:40px;border-radius:9px;background:#f3f4f6;
     flex-shrink:0;object-fit:cover}
.app .ph{width:40px;height:40px;border-radius:9px;background:#e8f8ee;
     color:#0a8f4a;display:flex;align-items:center;justify-content:center;
     font-weight:700;flex-shrink:0;font-size:16px}
.app .nm{font-weight:600;font-size:13px;margin-bottom:2px}
.app .ds{color:var(--sub);font-size:12px;line-height:1.5;
     display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
     overflow:hidden}
.app .id{color:#9ca3af;font-size:10.5px;margin-top:4px;
     font-family:ui-monospace,Consolas,monospace}
table.dirt{width:100%;border-collapse:collapse;font-size:12.5px;
     background:#fff;border:1px solid var(--line);border-radius:10px;
     overflow:hidden}
table.dirt th{background:#fafbfc;text-align:left;padding:9px 12px;
     font-size:11.5px;color:var(--sub);font-weight:600;
     border-bottom:1px solid var(--line);white-space:nowrap}
table.dirt td{padding:8px 12px;border-bottom:1px solid #f1f3f5;
     max-width:280px;overflow:hidden;text-overflow:ellipsis;
     white-space:nowrap}
table.dirt tr:last-child td{border-bottom:none}
table.dirt tr:hover td{background:#fafcff}
.avt{width:26px;height:26px;border-radius:5px;background:#e8f8ee;color:#0a8f4a;
     display:inline-flex;align-items:center;justify-content:center;
     font-size:11px;font-weight:700;vertical-align:-7px;margin-right:7px;
     overflow:hidden}
.avt img{width:100%;height:100%;object-fit:cover}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;
     margin:16px 0 4px;font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;
     padding:3px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.deptree{font-size:12.5px;line-height:2}
.deptree .lv1{padding-left:0;font-weight:600}
.deptree .lv2{padding-left:20px}
.deptree .lv3{padding-left:40px}
.deptree .lv4{padding-left:60px}
.deptree .lv5{padding-left:80px}
.deptree .nm2{color:#374151}
.deptree .ct{color:#9ca3af;font-size:11px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:hover:not(.on){border-color:var(--accent);color:var(--accent)}
input[type=search],select{border:1px solid var(--line);border-radius:6px;
     padding:5px 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
input[type=search]{width:200px}
input[type=search]:focus,select:focus{border-color:var(--accent)}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;
       font-size:12px;cursor:pointer;color:var(--text)}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{opacity:.88;color:#fff}
.spacer{flex:1}
.stat{color:var(--sub);font-size:12px;white-space:nowrap}
main{flex:1;display:flex;min-height:0}
aside{width:246px;background:var(--side);border-right:1px solid var(--line);
      overflow-y:auto;flex-shrink:0;padding:6px 0}
aside .sidehd{padding:6px 14px;font-size:11px;color:var(--sub);font-weight:600;
      letter-spacing:.4px;text-transform:uppercase}
aside .grp{padding:7px 14px;cursor:pointer;border-left:3px solid transparent;
      display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:center}
aside .grp:hover{background:var(--hover)}
aside .grp.on{background:var(--sel);border-left-color:var(--accent);font-weight:600}
aside .grp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .grp .n{color:var(--sub);font-size:11px;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow-y:auto;padding:16px 22px}
.row{display:flex;margin-bottom:13px;gap:8px}
.row.me{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:6px;background:#c7cdd4;color:#fff;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600}
.bub{max-width:min(640px,74%)}
.meta{font-size:11px;color:var(--sub);margin-bottom:3px}
.row.me .meta{text-align:right}
.txt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;
     white-space:pre-wrap;word-break:break-word}
.row.me .txt{background:var(--me);border-color:#86d95c}
.row.fresh .txt{animation:flash 2.6s ease-out}
@keyframes flash{0%{background:#fff3b0}100%{}}
.sys{width:100%;text-align:center;color:var(--sys);font-size:12px;margin:6px 0}
.media{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.media img{max-width:230px;max-height:230px;border-radius:8px;border:1px solid var(--line);
     cursor:zoom-in;display:block;background:#fff}
.row.me .media{justify-content:flex-end}
.fchip{display:inline-flex;align-items:center;gap:6px;background:#fff;
     border:1px solid var(--line);border-radius:8px;padding:7px 10px;
     text-decoration:none;color:var(--text);font-size:13px;max-width:100%}
.fchip:hover{border-color:var(--accent);background:#f7fff9}
.fchip .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.fchip .fs{color:var(--sub);font-size:11px;flex-shrink:0}
.pane{flex:1;overflow-y:auto;padding:16px 22px;display:none}
.pane.on{display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:12px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
       display:flex;flex-direction:column}
.mcard img{width:100%;height:148px;object-fit:cover;background:#f3f4f6;cursor:zoom-in}
.mcard .body{padding:8px 10px;font-size:12px}
.mcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .sub{color:var(--sub);margin-top:2px}
.empty{color:var(--sub);text-align:center;margin-top:60px}
mark{background:var(--hl);padding:0 2px;border-radius:2px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lb img{max-width:94vw;max-height:94vh;border-radius:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
       margin-bottom:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.card .k{font-size:12px;color:var(--sub)}
.card .v{font-size:24px;font-weight:700;margin-top:3px;color:var(--accent)}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
     margin-bottom:16px}
.sec h3{margin:0 0 12px;font-size:14px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar .lbl{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
     flex-shrink:0;color:var(--sub)}
.bar .track{flex:1;background:#f3f4f6;border-radius:4px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,#07c160,#4ade80);border-radius:4px;
     transition:width .5s}
.bar .val{width:52px;text-align:right;color:var(--sub);flex-shrink:0}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:8px}
.heat div{height:26px;border-radius:3px;background:#f3f4f6;position:relative}
.heat div span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
     font-size:9px;color:var(--sub)}
.hx{margin-bottom:22px}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;
       flex-direction:column;gap:8px;align-items:flex-end}
.tst{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);
     border-radius:8px;padding:9px 13px;font-size:13px;max-width:340px;
     box-shadow:0 4px 14px rgba(0,0,0,.10);animation:slidein .25s}
@keyframes slidein{from{transform:translateX(20px);opacity:0}}
.tst .h{font-weight:600;color:var(--accent);margin-bottom:2px}
.tst .b{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;
     white-space:nowrap}
#revoke{list-style:none;padding:0;margin:0}
#revoke li{border-bottom:1px solid var(--line);padding:9px 2px;font-size:13px}
#revoke li:last-child{border-bottom:none}
#revoke .rw{color:var(--sub);font-size:11px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#b9bfc6}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>企业微信 · 实时查看</h1>
  <span class="badge" id="connBadge">连接中…</span>
  <div class="tabs">
    <span class="tab on" data-tab="chat">聊天</span>
    <span class="tab" data-tab="content">内容<span class="n" id="nContent">·</span></span>
    <span class="tab" data-tab="media">媒体</span>
    <span class="tab" data-tab="stats">统计</span>
    <span class="tab" data-tab="tools">工具</span>
  </div>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="搜索消息 / 人名 / 文件名…">
  <button id="btnSync">立即同步</button>
  <button id="btnExp">导出</button>
  <select id="expFmt">
    <option value="json">JSON</option>
    <option value="md">Markdown</option>
    <option value="txt">TXT</option>
    <option value="csv">CSV</option>
    <option value="html">HTML</option>
  </select>
  <span class="stat" id="stat"></span>
</header>
<main>
  <aside id="conv">
    <div class="sidehd">会话</div>
  </aside>
  <div id="main">
    <div id="log" class="pane on"></div>
    <div id="paneContent" class="pane"></div>
    <div id="paneMedia" class="pane"><div class="mgrid" id="mgrid"></div></div>
    <div id="paneStats" class="pane"></div>
    <div id="paneTools" class="pane"></div>
  </div>
</main>
<div id="lb"><img id="lbimg" alt=""></div>
<div id="toast"></div>

<script>
const $  = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c;
  if(h!=null)e.innerHTML=h; return e;};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fsz = n => n<1024? n+' B' : n<1048576? (n/1024).toFixed(1)+' KB'
  : (n/1048576).toFixed(1)+' MB';
const ICONS = {图片:'🖼️',视频:'🎬',文件:'📄'};
const EXT = {pdf:'📕',doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📙',pptx:'📙',
  jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',webp:'🖼️',bmp:'🖼️',
  mp4:'🎬',mov:'🎬',avi:'🎬',mkv:'🎬',zip:'🗜️',rar:'🗜️'};
const extIcon = n => EXT[(String(n).split('.').pop()||'').toLowerCase()] || '📄';
const mediaURL = p => '/media/' + String(p).split('/').map(encodeURIComponent).join('/');

let TREE = [], CONVS = [], STATS = null, CUR = '__ALL__', TAB = 'chat';
let ALL_MSGS = [], MEDIA = [], LIVE = 0;
const convCount = {};

/* ---------- SSE 实时通道 ---------- */
function connect(){
  const es = new EventSource('/events');
  es.onopen = ()=> setConn(true);
  es.onerror = ()=>{ setConn(false); };
  es.onmessage = ev =>{
    let d; try{ d = JSON.parse(ev.data); }catch(e){ return; }
    if(d.type==='hello'){ 
      if(d.info&&d.info.messages) refreshCounters();
      loadConvTree(); return; }
    if(d.type==='new'){
      LIVE += d.count;
      const fresh = d.messages.map(mm=>normalize(mm));
      ALL_MSGS = ALL_MSGS.concat(fresh);
      appendLive(fresh);
      if(notifyOn) fresh.slice(0,3).forEach(notify);
      toast('收到新消息', d.count+' 条 · '+
        [...new Set(fresh.map(m=>m.c))].slice(0,2).join('、'));
      loadConvTree(); updateStat();
      if(TAB==='media') refreshMedia();
      if(TAB==='content' && CSUB==='notice'){ CONTENT=null; loadContent().then(renderContent); }
      return;
    }
    if(d.type==='status'){
      if(d.error){ setConn(false, d.error); }
      const t = [];
      if(d.messages!=null) t.push(d.messages+' 条消息');
      if(d.conversations!=null) t.push(d.conversations+' 个会话');
      if(d.media!=null) t.push(d.media+' 个媒体');
      if(t.length){ $('#stat').textContent = t.join(' · '); }
      if(!d.error) setConn(true);
    }
  };
  return es;
}
function setConn(ok, msg){
  $('#dot').classList.toggle('live', !!ok);
  const b = $('#connBadge');
  b.textContent = ok ? '实时已连接' : (msg ? '同步异常' : '连接中断');
  b.classList.toggle('warn', !ok);
}

/* ---------- 数据加载 ---------- */
function normalize(m){
  return {t:m.time, st:m.send_time, c:m.conversation, s:m.sender, m:m.text,
    k:m.kind||'text', me:m.me, media:m.media||null, mid:m.message_id};
}
async function loadMessages(){
  const r = await fetch('/api/messages').then(x=>x.json());
  ALL_MSGS = (r.messages||[]).map(normalize);
  renderLog();
}
async function loadConvTree(){
  const r = await fetch('/api/conversations').then(x=>x.json());
  CONVS = r.conversations||[];
  CONVS.forEach(c=>convCount[c.name]=c.messages);
  renderConv();
}
async function loadMedia(){
  const r = await fetch('/api/media?limit=0').then(x=>x.json());
  MEDIA = r.media||[];
  renderMedia();
}
async function loadStats(){
  STATS = await fetch('/api/stats').then(x=>x.json());
  renderStats();
}
async function loadTools(){
  await loadStatsInline();
  const r = await fetch('/api/revoked').then(x=>x.json());
  renderTools(r.revoked||[]);
}
function refreshCounters(){ loadMessages(); loadConvTree(); }

/* ---------- 左侧会话树 ---------- */
function renderConv(){
  const box = $('#conv');
  box.innerHTML = '<div class="sidehd">会话</div>';
  box.appendChild(grpEl('全部会话', ALL_MSGS.length, '__ALL__'));
  CONVS.forEach(c=> box.appendChild(grpEl(c.name, c.messages, c.name)));
}
function grpEl(name, n, key){
  const d = el('div', 'grp' + (CUR===key?' on':''));
  d.appendChild(el('span','nm', esc(name)));
  d.appendChild(el('span','n', n));
  d.onclick = ()=>{ CUR = key; renderConv();
    TAB==='media'? renderMedia() : renderLog(); updateStat(); };
  return d;
}

/* ---------- 聊天 ---------- */
function mediaHTML(list, kw){
  if(!list || !list.length) return '';
  let h = '<div class="media">';
  list.forEach(m=>{
    const nm = m.n || String(m.p).split('/').pop();
    const isImg = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(nm) || m.k==='图片';
    const u = mediaURL(m.p);
    if(isImg) h += `<a href="${u}" target="_blank">
      <img src="${u}" loading="lazy" title="${esc(nm)}"></a>`;
    else h += `<a class="fchip" href="${u}" target="_blank" download>
      <span>${extIcon(nm)}</span><span class="fn">${hl(nm,kw)}</span>
      <span class="fs">${fsz(m.sz||0)}</span></a>`;
  });
  return h + '</div>';
}
function hl(s,kw){
  s = String(s==null?'':s);
  if(!kw) return esc(s);
  const i = s.toLowerCase().indexOf(kw);
  if(i<0) return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+kw.length))+'</mark>'
       + esc(s.slice(i+kw.length));
}
function rowHTML(m, kw, fresh){
  if(m.k==='sys' && !m.media)
    return `<div class="sys">${esc(m.t)} · ${esc(m.m)}</div>`;
  const ini = esc((m.s||'?').trim().slice(0,1));
  return `<div class="row ${m.me?'me':''} ${fresh?'fresh':''}">
    <div class="av">${ini}</div><div class="bub">
    <div class="meta">${esc(m.s)} · ${esc(m.t)}
      ${CUR==='__ALL__'?' · '+esc(m.c):''}</div>
    <div class="txt">${hl(m.m,kw)}</div>
    ${mediaHTML(m.media, kw)}</div></div>`;
}
function filterList(list, kw){
  if(!kw) return list;
  return list.filter(m=> m.m.toLowerCase().includes(kw)
    || m.s.toLowerCase().includes(kw) || m.c.toLowerCase().includes(kw)
    || (m.media||[]).some(x=>(x.n||'').toLowerCase().includes(kw)));
}
function renderLog(){
  const kw = $('#q').value.trim().toLowerCase();
  let list = CUR==='__ALL__' ? ALL_MSGS : ALL_MSGS.filter(m=>m.c===CUR);
  list = filterList(list, kw);
  const log = $('#log');
  if(!list.length){ log.innerHTML='<div class="empty">没有匹配的消息</div>'; return; }
  const H = list.map(m=>rowHTML(m,kw,false)).join('');
  log.innerHTML = H;
  log.scrollTop = 0;
}
function appendLive(fresh){
  const kw = $('#q').value.trim().toLowerCase();
  const log = $('#log');
  if(!log.dataset.ready || TAB!=='chat') return;
  let list = fresh;
  if(CUR!=='__ALL__') list = list.filter(m=>m.c===CUR);
  if(!list.length) return;
  const atTop = log.scrollTop < 60;
  const H = list.map(m=>rowHTML(m,kw,true)).join('');
  log.insertAdjacentHTML('afterbegin', H);
  if(atTop) log.scrollTop = 0;
}

/* ---------- 媒体库 ---------- */
function renderMedia(){
  const kw = $('#q').value.trim().toLowerCase();
  let list = MEDIA;

function deptTree(depts){
  if(!depts.length) return '<span style="color:#6b7280">无部门数据</span>';
  const byParent = {};
  depts.forEach(d=> (byParent[d.parent_id||''] = byParent[d.parent_id||'']||[])
    .push(d));
  const out = [];
  const walk = (pid, lv)=>{
    (byParent[pid]||[]).forEach(d=>{
      out.push(`<div class="lv${Math.min(lv,5)}">
        <span class="nm2">📁 ${esc(d.name||d.dept_id)}</span>
        ${d.user_count? `<span class="ct"> · ${d.user_count} 人</span>`:''}</div>`);
      walk(d.dept_id, lv+1);
    });
  };
  walk('', 1);
  // 若有未挂到根上的，兜底平铺
  const shown = new Set([...out].map(String));
  if(!out.length) return depts.map(d=>
    `<div class="lv1"><span class="nm2">📁 ${esc(d.name)}</span></div>`).join('');
  return out.join('');
}

/* ---------- 统计 ---------- */
function bar(name, val, max){
  const p = max? Math.round(val/max*100) : 0;
  return `<div class="bar"><span class="lbl" title="${esc(name)}">${esc(name)}</span>
    <span class="track"><span class="fill" style="width:${p}%"></span></span>
    <span class="val">${val}</span></div>`;
}
function bars(title, arr){
  if(!arr || !arr.length) return '';
  const max = Math.max(...arr.map(x=>x.value));
  return `<div class="sec"><h3>${esc(title)}</h3>
    ${arr.map(x=>bar(x.name, x.value, max)).join('')}</div>`;
}
function renderStats(){
  if(!STATS) return;
  const s = STATS;
  const maxDay = s.by_day.length? Math.max(...s.by_day.map(d=>d.value)) : 1;
  const heat = s.by_hour.map(h=>{
    const a = h.value/maxDay;
    const bg = h.value? `rgba(7,193,96,${(0.12+a*0.88).toFixed(2)})` : '#f3f4f6';
    return `<div style="background:${bg}" title="${h.hour}时 · ${h.value}条">
      ${h.hour%3===0?`<span>${h.hour}</span>`:''}</div>`;
  }).join('');
  const days = s.by_day.slice(-40).map(d=>{
    const a = maxDay? d.value/maxDay : 0;
    return `<div style="flex:1;background:rgba(7,193,96,${(0.15+a*0.85).toFixed(2)});
      height:${Math.max(3, Math.round(a*58))}px;border-radius:2px"
      title="${d.date} · ${d.value}条"></div>`;
  }).join('');

  $('#paneStats').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">消息总数</div><div class="v">${s.total}</div></div>
      <div class="card"><div class="k">会话</div><div class="v">${s.conversations}</div></div>
      <div class="card"><div class="k">参与人</div><div class="v">${s.people}</div></div>
      <div class="card"><div class="k">媒体文件</div><div class="v">${s.media_files}</div></div>
      <div class="card"><div class="k">我发出</div><div class="v">${s.me}</div></div>
      <div class="card"><div class="k">他人发出</div><div class="v">${s.other}</div></div>
    </div>
    <div class="sec"><h3>时段分布（0–23 时）</h3>
      <div class="heat">${heat}</div><div style="height:18px"></div></div>
    <div class="sec"><h3>按日活跃度</h3>
      <div style="display:flex;align-items:flex-end;gap:2px;height:62px">${days}</div></div>
    ${bars('消息类型占比', s.by_type)}
    ${bars('发言排行', s.top_senders)}
    <div class="sec"><h3>会话排行 / 群聊画像</h3>
      ${s.conv_detail.slice(0,20).map(c=>`
        <details style="margin-bottom:8px">
          <summary style="cursor:pointer;font-weight:600">
            ${esc(c.name)}
            <span style="color:#6b7280;font-weight:400;font-size:12px">
              · ${c.messages} 条 · ${c.people} 人 · ${c.media} 个媒体</span>
          </summary>
          <div style="padding:8px 0 4px 18px">
            ${c.top.map(p=>bar(p.name, p.value,
              Math.max(...c.top.map(x=>x.value)))).join('')}
          </div>
        </details>`).join('')}
    </div>`;
}

/* ---------- Tab / 搜索 / 按钮 ---------- */
function setTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(x=>
    x.classList.toggle('on', x.dataset.tab===t));
  ['log','paneContent','paneMedia','paneStats','paneTools'].forEach(id=>
    $('#'+id).classList.remove('on'));
  const map = {chat:'log', content:'paneContent', media:'paneMedia',
    stats:'paneStats', tools:'paneTools'};
  $('#'+map[t]).classList.add('on');
  if(t==='chat'){ $('#log').dataset.ready='1'; renderLog(); }
  if(t==='content'){ if(CONTENT) renderContent(); else
    loadContent().then(renderContent).catch(e=>{
      $('#paneContent').innerHTML =
        '<div class="empty">内容读取失败：'+esc(e.message)+'</div>'; }); }
  if(t==='media') refreshMedia();
  if(t==='stats'){ if(STATS) renderStats(); else loadStats(); }
  if(t==='tools') loadTools();
  updateStat();
}
function refreshMedia(){ loadMedia(); }
function updateStat(){
  const s = $('#stat');
  if(TAB==='chat'){
    const n = CUR==='__ALL__'? ALL_MSGS.length
      : ALL_MSGS.filter(m=>m.c===CUR).length;
    const nm = ALL_MSGS.filter(m=>m.media).length;
    s.textContent = `${ALL_MSGS.length} 条消息 · ${CONVS.length} 个会话 · ${nm} 条含附件`
      + (LIVE? ` · 本轮新增 ${LIVE}` : '');
  } else if(TAB==='content'){
    const c = (CONTENT && CONTENT.counts) || {};
    s.textContent = (CONTENT && CONTENT.counts)
      ? `公告 ${c.notices} · 应用 ${c.apps} · 通讯录 ${c.members} 人 · 群成员 ${c.group_members}`
      : '读取中…';
  } else if(TAB==='media'){
    const n = CUR==='__ALL__'? MEDIA.length : MEDIA.filter(m=>m.conv===CUR).length;
    s.textContent = `${MEDIA.length} 个媒体文件 · 当前 ${n}`;
  } else if(TAB==='stats' && STATS){
    s.textContent = `${STATS.total} 条 · ${STATS.conversations} 会话 · ${STATS.people} 人`;
  } else s.textContent = '';
}
document.querySelectorAll('.tab').forEach(t=>
  t.onclick = ()=> setTab(t.dataset.tab));
let qt = null;
$('#q').oninput = ()=>{
  clearTimeout(qt);
  qt = setTimeout(()=>{
    if(TAB==='chat') renderLog();
    else if(TAB==='media') renderMedia();
    else if(TAB==='content'){ DIR_Q = $('#q').value.trim(); DIR_PAGE=0;
      if(CSUB==='dir') loadDir(); }
  }, 220);
};
$('#btnSync').onclick = async ()=>{
  $('#btnSync').textContent = '同步中…';
  await fetch('/api/sync/now', {method:'POST'});
  setTimeout(()=> $('#btnSync').textContent='立即同步', 1500);
  toast('已触发同步', '稍后如有新消息会自动出现');
};
$('#btnExp').onclick = ()=>{
  const f = $('#expFmt').value;
  const q = CUR==='__ALL__' ? '' : '&conv='+encodeURIComponent(CUR);
  location.href = '/api/export?format='+f+q;
  toast('已开始导出', f.toUpperCase() + ' · ' + (CUR==='__ALL__'?'全部会话':CUR));
};

/* ---------- 启动 ---------- */
let ENGINE_INFO = null;
(async function boot(){
  connect();
  await Promise.all([loadMessages(), loadConvTree(), loadMedia()]);
  try{ ENGINE_INFO = await fetch('/api/info').then(x=>x.json()); }catch(e){}
  setTab('chat');
  updateStat();
  setInterval(async()=>{                       // 兜底：定期刷新会话计数
    try{ ENGINE_INFO = await fetch('/api/info').then(x=>x.json());
      setConn(!ENGINE_INFO.error, ENGINE_INFO.error);
    }catch(e){ setConn(false); }
  }, 30000);
})();
</script>
